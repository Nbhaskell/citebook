[project]
name = "citebook"
version = "0.0.0"
description = "Website booking chatbot where the model talks and code decides (synthetic demo data)"
requires-python = ">=3.13,<3.14"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["citebook", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
