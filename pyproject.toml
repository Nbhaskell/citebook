[project]
name = "citebook"
version = "0.0.0"
description = "Website booking chatbot where the model talks and code decides (synthetic demo data)"
requires-python = ">=3.13,<3.14"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The knowledge-base document template is prose; wrapping it would hide the wording.
"tools/build_data.py" = ["E501"]
# Sample customer messages ported unchanged from Citedesk; wrapping them would change them.
"tests/test_screening_ported.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["citebook", "tools", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
